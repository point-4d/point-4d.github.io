<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>cat_jumping — Point4D</title>
<style>
 html,body{margin:0;height:100%;background:#fff;font-family:system-ui,sans-serif;overflow:hidden}
 #wrap{display:flex;width:100vw;height:100vh}
 #ui{flex:0 0 232px;overflow-y:auto;background:#fafbfc;border-right:1px solid #ddd;
     padding:12px;display:flex;flex-direction:column;gap:10px;font-size:12.5px}
 #ui label{display:flex;align-items:center;gap:6px;white-space:nowrap;justify-content:space-between}
 #ui label input[type=range]{flex:1;min-width:0}
 #ui .grp{border-top:1px solid #e5e5e5;padding-top:8px;display:flex;flex-direction:column;gap:6px}
 #rec{padding:5px 12px;border:1px solid #c00;color:#c00;background:#fff;border-radius:4px;cursor:pointer;font-weight:600}
 #rec.on{background:#c00;color:#fff}
 #filters{font-size:12px}
 #filters .row{display:flex;align-items:center;gap:6px;margin:3px 0}
 #filters .row span.ax{width:12px;font-weight:700}
 #filters input[type=range]{flex:1;min-width:0}
 #filters .val{width:74px;text-align:right;color:#666;font-size:10.5px}
 #left{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;background:#fff;position:relative}
 #left img{max-width:100%;max-height:100%;display:block}
 #ov{position:absolute;pointer-events:none}
 #right{flex:1.15;min-width:0;position:relative}
 #c{display:block;width:100%;height:100%}
 button{cursor:pointer}
 #load{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:15px;color:#555;z-index:6}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/LineSegmentsGeometry.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/LineMaterial.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/LineSegments2.js"></script>
</head><body>
<div id="wrap">
  <div id="ui">
    <b>cat_jumping</b>
    <div class="grp">
      <div style="display:flex;gap:8px;align-items:center;">
        <button id="play">▶</button><span id="ftxt"></span>
      </div>
      <input id="frame" type="range" min="0" value="0">
      <label>FPS<input id="fps" type="range" min="1" max="60"></label>
    </div>
    <div class="grp">
      <label>Trail<input id="trail" type="range" min="0" max="200"><span id="trailtxt"></span></label>
      <label>Stride<input id="tstride" type="range" min="1" max="32" value="4"><span id="tstridetxt">4</span></label>
      <label>Pt<input id="ptsize" type="range" min="1" max="10" value="4"></label>
      <label>Line<input id="lwidth" type="range" min="1" max="8" value="2"></label>
      <label>Depth pt<input id="dsize" type="range" min="1" max="5" value="1"></label>
    </div>
    <div class="grp">
      <label><input id="showpts" type="checkbox" checked>Depth points</label>
      <label><input id="showtraj" type="checkbox" checked>Tracks</label>
      <label><input id="showuv" type="checkbox" checked>2D tracks</label>
    </div>
    <div class="grp" id="filters">
      <b>Track start filter</b>
      <div class="row"><span class="ax">x</span><input type="range" id="fx0"><input type="range" id="fx1"><span class="val" id="fxv"></span></div>
      <div class="row"><span class="ax">y</span><input type="range" id="fy0"><input type="range" id="fy1"><span class="val" id="fyv"></span></div>
      <div class="row"><span class="ax">z</span><input type="range" id="fz0"><input type="range" id="fz1"><span class="val" id="fzv"></span></div>
      <div class="row"><button id="freset" style="margin-left:auto">reset</button></div>
    </div>
    <div class="grp">
      <button id="rec">● REC 3D</button><span id="rectxt"></span>
    </div>
  </div>
  <div id="left"><img id="pimg"><canvas id="ov"></canvas></div>
  <div id="right"><canvas id="c"></canvas></div>
</div>
<div id="load">loading…</div>
<script>
const el=id=>document.getElementById(id);
const F16LUT=(()=>{const t=new Float32Array(65536);
 for(let h=0;h<65536;h++){const sg=(h>>15)&1,e=(h>>10)&31,m=h&1023;
  t[h]=e===0?(sg?-1:1)*5.9604644775390625e-8*m:e===31?(m?NaN:(sg?-1:1)*Infinity):(sg?-1:1)*Math.pow(2,e-15)*(1+m/1024);}
 return t;})();
function f16buf(buf){const u=new Uint16Array(buf),o=new Float32Array(u.length);for(let i=0;i<u.length;i++)o[i]=F16LUT[u[i]];return o;}
function hsl2rgb(h,s,l){const a=s*Math.min(l,1-l);const f=n=>{const k=(n+h*12)%12;return l-a*Math.max(-1,Math.min(k-3,Math.min(9-k,1)));};return [f(0),f(8),f(4)];}

let META,T,N,traj,uv,hcol,keep;
const cache=new Map(),inflight=new Map(),CACHE_MAX=60,PREFETCH=24;
const IMGS=[];
async function preloadFrames(){
  for(let t=0;t<T;t++){const im=new Image();
    im.src='frames/'+String(t).padStart(5,'0')+'.jpg';IMGS[t]=im;
    try{await im.decode();}catch(e){}}
}
async function boot(){
  META=await (await fetch('meta.json')).json();
  T=META.T;N=META.N;
  preloadFrames();
  el('frame').max=T-1;el('fps').value=META.fps;el('trail').value=META.trail;el('trail').max=T;
  const lo=META.q_lo,hi=META.q_hi;
  [['fx',0],['fy',1],['fz',2]].forEach(([p,a])=>{for(const q of[0,1]){const r=el(p+q);
    r.min=lo[a]-0.01;r.max=hi[a]+0.01;r.step=(hi[a]-lo[a])/200||0.01;r.value=q===0?r.min:r.max;r.oninput=updateFilter;}});
  el('freset').onclick=()=>{[['fx'],['fy'],['fz']].forEach(([p])=>{el(p+'0').value=el(p+'0').min;el(p+'1').value=el(p+'1').max;});updateFilter();};
  const [tb,ub]=await Promise.all([fetch('traj.bin').then(r=>r.arrayBuffer()),fetch('uv.bin').then(r=>r.arrayBuffer())]);
  traj=f16buf(tb);uv=META.has_uv?f16buf(ub):null;
  hcol=new Float32Array(N*3);let ylo=1e9,yhi=-1e9;
  for(let i=0;i<N;i++){const y=traj[i*3+1];if(isFinite(y)){ylo=Math.min(ylo,y);yhi=Math.max(yhi,y);}}
  for(let i=0;i<N;i++){const y=traj[i*3+1];const t=isFinite(y)?Math.min(1,Math.max(0,(y-ylo)/((yhi-ylo)||1))):0.5;
    const c=hsl2rgb(t*0.667,1,0.5);hcol[i*3]=c[0];hcol[i*3+1]=c[1];hcol[i*3+2]=c[2];}
  keep=new Uint8Array(N).fill(1);
  el('load').remove();setupScene();updateFilter();setFrame(0);animate();
}
let canvas,renderer,camera,controls,scene,pts,pg,pmat,lmat,lseg=null,cg,cur,cmat;
function setupScene(){
  canvas=el('c');
  renderer=new THREE.WebGLRenderer({canvas,antialias:true,preserveDrawingBuffer:true});
  renderer.setPixelRatio(window.devicePixelRatio);
  camera=new THREE.PerspectiveCamera(50,1,0.01,100);
  camera.up.set(0,-1,0);camera.position.set(0.3,-0.6,-2.2);camera.lookAt(0,0,0);
  controls=new THREE.OrbitControls(camera,canvas);controls.target.set(0,0,0);
  scene=new THREE.Scene();scene.background=new THREE.Color(0xffffff);
  pg=new THREE.BufferGeometry();
  pg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(0),3));
  pg.setAttribute('color',new THREE.BufferAttribute(new Float32Array(0),3));
  pmat=new THREE.PointsMaterial({size:1,vertexColors:true,sizeAttenuation:false});
  pts=new THREE.Points(pg,pmat);pts.frustumCulled=false;scene.add(pts);
  lmat=new THREE.LineMaterial({vertexColors:true,linewidth:2});
  cg=new THREE.BufferGeometry();
  cg.setAttribute('position',new THREE.BufferAttribute(new Float32Array(N*3),3));
  cg.setAttribute('color',new THREE.BufferAttribute(new Float32Array(N*3),3));
  cmat=new THREE.PointsMaterial({size:4,vertexColors:true,sizeAttenuation:false});
  cur=new THREE.Points(cg,cmat);cur.frustumCulled=false;scene.add(cur);
}
function getDepth(t){
  if(cache.has(t))return Promise.resolve(cache.get(t));
  if(inflight.has(t))return inflight.get(t);
  const pr=fetch('depth/'+String(t).padStart(5,'0')+'.bin').then(r=>r.arrayBuffer()).then(buf=>{
    const n=new Uint32Array(buf,0,1)[0];
    const p=f16buf(buf.slice(4,4+n*6));
    const cu=new Uint8Array(buf,4+n*6,n*3);
    const c=new Float32Array(n*3);for(let i=0;i<n*3;i++)c[i]=cu[i]/255;
    const d={n,p,c};cache.set(t,d);inflight.delete(t);
    if(cache.size>CACHE_MAX)cache.delete(cache.keys().next().value);
    return d;});
  inflight.set(t,pr);return pr;
}
function prefetch(t){for(let k=1;k<=PREFETCH;k++){const f=(t+k)%T;
  if(!cache.has(f)&&!inflight.has(f)&&inflight.size<10)getDepth(f);}}
function updateFilter(){
  const x0=+el('fx0').value,x1=+el('fx1').value,y0=+el('fy0').value,y1=+el('fy1').value,z0=+el('fz0').value,z1=+el('fz1').value;
  el('fxv').textContent=x0.toFixed(2)+'~'+x1.toFixed(2);
  el('fyv').textContent=y0.toFixed(2)+'~'+y1.toFixed(2);
  el('fzv').textContent=z0.toFixed(2)+'~'+z1.toFixed(2);
  if(keep)for(let i=0;i<N;i++){const x=traj[i*3],y=traj[i*3+1],z=traj[i*3+2];
    keep[i]=(isFinite(x)&&x>=Math.min(x0,x1)&&x<=Math.max(x0,x1)&&y>=Math.min(y0,y1)&&y<=Math.max(y0,y1)
             &&z>=Math.min(z0,z1)&&z<=Math.max(z0,z1))?1:0;}
  if(META)setFrame(frame);
}
let frame=0,playing=false,timer=null,tok=0;
async function setFrame(t){
  frame=t;el('frame').value=t;el('ftxt').textContent=(t+1)+' / '+T;
  const my=++tok;
  const W=+el('trail').value,t0=W>0?Math.max(0,t-W):0,stride=+el('tstride').value;
  const d=await getDepth(t);if(my!==tok)return;prefetch(t);
  pg.setAttribute('position',new THREE.BufferAttribute(d.p,3));
  pg.setAttribute('color',new THREE.BufferAttribute(d.c,3));
  pg.setDrawRange(0,d.n);pmat.size=+el('dsize').value;pts.visible=el('showpts').checked;
  const cp=cg.attributes.position.array,cc=cg.attributes.color.array;
  let nc=0;const segP=[],segC=[];
  for(let i=0;i<N;i+=stride){
    if(!keep[i])continue;
    const r=hcol[i*3],g=hcol[i*3+1],b=hcol[i*3+2],o=(t*N+i)*3;
    if(isFinite(traj[o])){cp[nc*3]=traj[o];cp[nc*3+1]=traj[o+1];cp[nc*3+2]=traj[o+2];
      cc[nc*3]=r;cc[nc*3+1]=g;cc[nc*3+2]=b;nc++;}
    if(el('showtraj').checked)for(let k=t0;k<t;k++){
      const A=(k*N+i)*3,B=((k+1)*N+i)*3;
      if(!isFinite(traj[A])||!isFinite(traj[B]))continue;
      segP.push(traj[A],traj[A+1],traj[A+2],traj[B],traj[B+1],traj[B+2]);
      segC.push(r,g,b,r,g,b);}
  }
  cg.setDrawRange(0,nc);cg.attributes.position.needsUpdate=cg.attributes.color.needsUpdate=true;
  cmat.size=+el('ptsize').value;cur.visible=el('showtraj').checked;
  if(lseg){scene.remove(lseg);lseg.geometry.dispose();lseg=null;}
  if(segP.length){const g=new THREE.LineSegmentsGeometry();g.setPositions(segP);g.setColors(segC);
    lmat.linewidth=+el('lwidth').value;lseg=new THREE.LineSegments2(g,lmat);lseg.frustumCulled=false;scene.add(lseg);}
  el('pimg').src='frames/'+String(t).padStart(5,'0')+'.jpg';
  requestAnimationFrame(()=>drawOverlay(t,t0,stride));
}
function drawOverlay(t,t0,stride){
  const img=el('pimg'),cv=el('ov');
  const r=img.getBoundingClientRect(),pr=img.parentElement.getBoundingClientRect();
  cv.style.left=(r.left-pr.left)+'px';cv.style.top=(r.top-pr.top)+'px';
  cv.width=r.width;cv.height=r.height;
  const ctx=cv.getContext('2d');ctx.clearRect(0,0,cv.width,cv.height);
  if(!el('showuv').checked||!uv)return;
  const sx=cv.width/META.uv_wh[0],sy=cv.height/META.uv_wh[1];ctx.lineWidth=+el('lwidth').value*0.9;
  for(let i=0;i<N;i+=stride){
    if(!keep[i])continue;
    ctx.strokeStyle=ctx.fillStyle='rgb('+(hcol[i*3]*255|0)+','+(hcol[i*3+1]*255|0)+','+(hcol[i*3+2]*255|0)+')';
    ctx.beginPath();let st=false;
    for(let k=t0;k<=t;k++){const o=(k*N+i)*2,u=uv[o],v=uv[o+1];
      if(!isFinite(u)){st=false;continue;}if(st)ctx.lineTo(u*sx,v*sy);else ctx.moveTo(u*sx,v*sy);st=true;}
    ctx.stroke();const o=(t*N+i)*2;
    if(isFinite(uv[o])){ctx.beginPath();ctx.arc(uv[o]*sx,uv[o+1]*sy,+el('ptsize').value*0.7,0,6.28);ctx.fill();}
  }
}
el('frame').oninput=e=>setFrame(+e.target.value);
el('trail').oninput=()=>{el('trailtxt').textContent=el('trail').value;setFrame(frame);};
el('tstride').oninput=()=>{el('tstridetxt').textContent=el('tstride').value;setFrame(frame);};
for(const id of['ptsize','lwidth','dsize'])el(id).oninput=()=>setFrame(frame);
el('fps').oninput=()=>{if(playing){stop();start();}};
el('showpts').onchange=el('showtraj').onchange=el('showuv').onchange=()=>setFrame(frame);
function start(){playing=true;el('play').textContent='❚❚';timer=setInterval(()=>setFrame((frame+1)%T),1000/+el('fps').value);}
function stop(){playing=false;el('play').textContent='▶';clearInterval(timer);}
el('play').onclick=()=>playing?stop():start();
window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();playing?stop():start();}
  if(e.code==='ArrowRight')setFrame(Math.min(T-1,frame+1));if(e.code==='ArrowLeft')setFrame(Math.max(0,frame-1));});
let rec=null;const recBtn=el('rec');
recBtn.onclick=()=>{if(rec){rec.stop();rec=null;recBtn.classList.remove('on');recBtn.textContent='● REC 3D';return;}
  const mr=new MediaRecorder(canvas.captureStream(+el('fps').value),{mimeType:'video/webm;codecs=vp9',videoBitsPerSecond:12e6});
  const chunks=[];mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  mr.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:'video/webm'}));
    a.download='cat_jumping_point4d.webm';a.click();};
  mr.start();rec=mr;recBtn.classList.add('on');recBtn.textContent='■ STOP';};
function animate(){
  requestAnimationFrame(animate);
  const w=canvas.clientWidth,h=canvas.clientHeight;
  if(canvas.width!==Math.floor(w*devicePixelRatio)||canvas.height!==Math.floor(h*devicePixelRatio)){
    renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
  lmat.resolution.set(canvas.width,canvas.height);
  controls.update();renderer.render(scene,camera);
}
el('trailtxt').textContent=el('trail').value;
boot();
</script></body></html>
